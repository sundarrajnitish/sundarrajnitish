<title id="t">Nitish Sundarraj: Connecting ideas. Making things work.</title><desc id="d">A pen plotter signs 'nitish' in white on black while six disciplines, from silicon and firmware to robotics, cloud and physical AI, settle into orbit around the name.</desc>
