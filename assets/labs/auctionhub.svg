<title id="t">AuctionHub: Live auctions on serverless AWS, in real time.</title><desc id="d">Bids push the price up on a lot with a countdown; a late bid triggers a soft close extension before the hammer falls.</desc>
<style>
.play{animation:nudge 2.4s ease-in-out infinite}@keyframes nudge{0%,70%,100%{transform:none}80%{transform:translateX(4px)}}
@keyframes ring{0%{stroke-dashoffset:0}58%{stroke-dashoffset:170}60%{stroke-dashoffset:110}82%{stroke-dashoffset:207}100%{stroke-dashoffset:207}}.ring{animation:ring 10s linear infinite}
@keyframes bd0{0%{opacity:0}6%{opacity:0}6.01%{opacity:1}20%{opacity:1}20.01%{opacity:0}100%{opacity:0}}.bd0{animation:bd0 10s linear infinite}
@keyframes bd1{0%{opacity:0}20%{opacity:0}20.01%{opacity:1}34%{opacity:1}34.01%{opacity:0}100%{opacity:0}}.bd1{animation:bd1 10s linear infinite}
@keyframes bd2{0%{opacity:0}34%{opacity:0}34.01%{opacity:1}50%{opacity:1}50.01%{opacity:0}100%{opacity:0}}.bd2{animation:bd2 10s linear infinite}
@keyframes bd3{0%{opacity:0}50%{opacity:0}50.01%{opacity:1}66%{opacity:1}66.01%{opacity:0}100%{opacity:0}}.bd3{animation:bd3 10s linear infinite}
@keyframes bd4{0%{opacity:0}66%{opacity:0}66.01%{opacity:1}98%{opacity:1}98.01%{opacity:0}100%{opacity:0}}.bd4{animation:bd4 10s linear infinite}
@keyframes soft{0%{opacity:0}59%{opacity:0}60%{opacity:1}80%{opacity:1}81%{opacity:0}100%{opacity:0}}.soft{animation:soft 10s linear infinite}
@keyframes sold{0%{opacity:0;transform:scale(1.6)}84%{opacity:0;transform:scale(1.6)}86%{opacity:1;transform:scale(1)}98%{opacity:1;transform:scale(1)}100%{opacity:0}}.sold{animation:sold 10s linear infinite;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion: reduce){.loop{animation:none!important;opacity:1!important}}
</style>

