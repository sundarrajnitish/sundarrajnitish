<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-labelledby="t d">
<title id="t">Next build: yours? Let's connect.</title><desc id="d">Next build: yours? Let's connect.</desc>
<style>
.arrow{animation:arrow 3.2s cubic-bezier(.16,1,.3,1) infinite}@keyframes arrow{0%,55%,100%{transform:none}75%{transform:translateX(7px)}}
.sweep{animation:sweep 6s linear infinite}@keyframes sweep{0%{transform:translateX(-260px)}60%,100%{transform:translateX(1240px)}}
@media (prefers-reduced-motion: reduce){.loop{animation:none!important;opacity:1!important}}
</style>

<defs>
<linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<clipPath id="edge"><rect x="18" y="0" width="1164" height="2"/></clipPath>
</defs>
<rect x="0.5" y="0.5" width="1199" height="199" rx="18" fill="#000" stroke="#2C2C2C"/>
<g clip-path="url(#edge)"><rect class="sweep loop" x="0" y="0" width="240" height="1.5" fill="url(#beam)"/></g>
<text x="40" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',system-ui,'Helvetica Neue',Arial,sans-serif" font-size="48" font-weight="600" fill="#F5F5F5" letter-spacing="-0.6">Next build: yours?</text>
<text x="40" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',system-ui,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#A3A3A3" >If it can be built, I'd like to try. If it can't, I'd like to find out why.</text>
<rect x="904" y="72" width="256" height="60" rx="30.0" fill="#F5F5F5"/>
<text x="940" y="110" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',system-ui,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="600" fill="#050505" >Let's connect</text>
<g class="arrow loop"><path d="M1096 102.0h24m-9 -9l9 9l-9 9" fill="none" stroke="#050505" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>

</svg>
