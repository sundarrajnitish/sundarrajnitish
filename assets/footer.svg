<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-labelledby="t d">
<title id="t">Next build: yours? Let's connect.</title><desc id="d">Next build: yours? Let's connect.</desc>
<style>
.arrow{animation:arrow 3.2s cubic-bezier(.22,.61,.36,1) infinite}@keyframes arrow{0%,55%,100%{transform:none}75%{transform:translateX(7px)}}
.sweep{animation:sweep 6s linear infinite}@keyframes sweep{0%{transform:translateX(-260px)}60%,100%{transform:translateX(1240px)}}
@media (prefers-reduced-motion: reduce){.loop{animation:none!important;opacity:1!important}}
</style>

<defs>
<linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101521"/><stop offset="1" stop-color="#06070A"/></linearGradient>
<linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#FF9442" stop-opacity="0"/><stop offset=".5" stop-color="#FFD479" stop-opacity=".95"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></linearGradient>
<linearGradient id="fglow" gradientUnits="userSpaceOnUse" x1="280" y1="50" x2="460" y2="95"><stop offset="0" stop-color="#FF9442"/><stop offset=".55" stop-color="#FFD479"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
<clipPath id="edge"><rect x="22" y="0" width="1156" height="2.5"/></clipPath>
</defs>
<rect x="0.5" y="0.5" width="1199" height="199" rx="22" fill="url(#fbg)" stroke="#242B3A"/>
<g clip-path="url(#edge)"><rect class="sweep loop" x="0" y="0" width="260" height="2" fill="url(#beam)"/></g>
<text x="40" y="94" font-family="'Inter Tight','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif" font-size="48" font-weight="700" letter-spacing="-1" fill="#F4F6FB">Next build: <tspan font-family="'Instrument Serif','Iowan Old Style','Palatino Linotype','Book Antiqua',Georgia,'Times New Roman',serif" font-style="italic" font-weight="400" font-size="54" fill="url(#fglow)">yours?</tspan></text>
<text x="40" y="142" font-family="'Inter Tight','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#9EA7B8" >If it can be built, I'd like to try. If it can't, I'd like to find out why.</text>
<rect x="904" y="72" width="256" height="60" rx="30.0" fill="#F4F6FB"/>
<text x="940" y="110" font-family="'Inter Tight','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#06070A" >Let's connect</text>
<g class="arrow loop"><path d="M1096 102.0h24m-9 -9l9 9l-9 9" fill="none" stroke="#06070A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>

</svg>
